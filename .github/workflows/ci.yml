name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore PanzerGeneral/PanzerGeneral.csproj

      - name: Build (Debug)
        run: dotnet build PanzerGeneral/PanzerGeneral.csproj --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build PanzerGeneral/PanzerGeneral.csproj --configuration Release --no-restore
